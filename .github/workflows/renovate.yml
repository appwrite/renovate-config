name: renovate

on:
  schedule:
    - cron: "0 6 * * *" # Daily 06:00 UTC
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (log what would change, open no PRs)"
        type: boolean
        default: false
      debug:
        description: "Enable Renovate debug logging"
        type: boolean
        default: false
      repositories:
        description: "Comma-separated owner/repo list (one owner) to run instead of every installed repository"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: renovate

env:
  # Generated SDKs are updated through sdk-generator. These repositories run Renovate from
  # their own workflows, so they are skipped here to avoid processing them twice.
  EXCLUDED: >-
    appwrite/sdk-generator
    appwrite-labs/cluster-configuration-generator
    appwrite-labs/application-configuration
  CHUNK: 40
  # Orgs the runner covers. utopia-php has the app on selected repositories only: the
  # packages absorbed into appwrite/appwrite are split mirrors and must not get PRs.
  OWNERS: appwrite appwrite-labs open-runtimes utopia-php
  # Forks are skipped unless listed here; each opts in with forkProcessing in its renovate.json.
  FORKS: >-
    appwrite/grafana-oncall

jobs:
  # An app token lives one hour, so the repositories are split into chunks that each
  # run as their own job with a fresh token.
  plan:
    runs-on: ubuntu-latest
    environment: renovate
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
    steps:
      - name: generate appwrite token
        id: appwrite
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: appwrite

      # An org without the app installed is skipped with a warning rather than blocking the others.
      - name: generate appwrite-labs token
        id: labs
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: appwrite-labs

      - name: generate open-runtimes token
        id: runtimes
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: open-runtimes

      - name: generate utopia-php token
        id: utopia
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: utopia-php

      - name: split repositories into chunks
        id: chunks
        env:
          REPOSITORIES: ${{ inputs.repositories }}
          APPWRITE_TOKEN: ${{ steps.appwrite.outputs.token }}
          LABS_TOKEN: ${{ steps.labs.outputs.token }}
          RUNTIMES_TOKEN: ${{ steps.runtimes.outputs.token }}
          UTOPIA_TOKEN: ${{ steps.utopia.outputs.token }}
        run: |
          if [ -n "$REPOSITORIES" ]; then
            owners=$(jq -rn --arg repositories "$REPOSITORIES" '$repositories | split(",") | map(split("/")[0]) | unique | join(" ")')
            case "$owners" in
              *" "*) echo "::error::repositories must all belong to one org (got: $owners)"; exit 1 ;;
            esac
            case " $OWNERS " in
              *" $owners "*) ;;
              *) echo "::error::repositories must all belong to one of: $OWNERS (got: $owners)"; exit 1 ;;
            esac
            jq -cn --arg owner "$owners" --arg repositories "$REPOSITORIES" \
              '[{owner: $owner, label: "\($owner) manual", repositories: $repositories}]' > chunks.json
          else
            for owner in $OWNERS; do
              case "$owner" in
                appwrite) token="$APPWRITE_TOKEN" ;;
                appwrite-labs) token="$LABS_TOKEN" ;;
                open-runtimes) token="$RUNTIMES_TOKEN" ;;
                utopia-php) token="$UTOPIA_TOKEN" ;;
              esac
              if [ -z "$token" ]; then
                echo "::warning::renovate appwrite is not installed on $owner; skipping it" >&2
                continue
              fi
              GH_TOKEN="$token" gh api --paginate /installation/repositories \
                --jq ".repositories[] | select(.archived | not) | [.full_name, .fork] | @tsv" \
                | jq -R --arg owner "$owner" --arg excluded "$EXCLUDED" --arg forks "$FORKS" 'split("\t") | {owner: $owner, name: .[0], fork: (.[1] == "true")}
                    | select((.fork | not) or (.name as $name | $forks | split(" ") | index($name)))
                    | select((.name | split("/")[1] | startswith("sdk-for-")) | not)
                    | select(.name as $name | ($excluded | split(" ") | index($name)) | not)'
            done | jq -cs --argjson size "$CHUNK" 'group_by(.owner) | map(
                [.[].name] as $names
                | .[0].owner as $owner
                | (($names | length) + $size - 1) / $size | floor as $total
                | [range(0; $total) as $n
                   | {owner: $owner,
                      label: "\($owner) \($n + 1)/\($total)",
                      repositories: ($names[$n * $size:($n + 1) * $size] | join(","))}]
              ) | add // []' > chunks.json
          fi
          jq -r '.[] | "\(.label): \(.repositories | split(",") | length) repositories"' chunks.json
          echo "chunks=$(cat chunks.json)" >> "$GITHUB_OUTPUT"

  renovate:
    name: renovate ${{ matrix.chunk.label }}
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    # Stops before the job's app token expires.
    timeout-minutes: 55
    # The app credentials live only in this environment, which deploys from main alone,
    # so a workflow changed on another branch cannot read them.
    environment: renovate
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      # The app token, not GITHUB_TOKEN, so Renovate's PRs trigger CI in each repository.
      - name: generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.chunk.owner }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: enable dry run
        if: inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: enable debug logging
        if: inputs.debug
        run: echo "LOG_LEVEL=debug" >> "$GITHUB_ENV"

      - name: renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: global.json
          renovate-version: 44.202.1
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ matrix.chunk.repositories }}
